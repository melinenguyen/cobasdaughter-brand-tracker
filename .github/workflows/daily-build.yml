name: Daily brand tracker build

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 13:00 ICT
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "**.py"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch mentions
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 fetch_mentions.py

      - name: Sync search volume (from any dropped CSVs)
        run: python3 _lib/search_volume.py

      - name: Build dashboard
        run: python3 build_dashboard.py

      - name: Commit updated data back to main
        run: |
          git config user.name "cobasdaughter-brand-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mentions.json data/search_volume.json data/.seeded 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: daily data refresh [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
